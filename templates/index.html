<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador de Gráficos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <form action="/graficar" method="post" class="bg-white p-8 rounded-lg shadow w-full max-w-md">
    <h1 class="text-2xl font-bold mb-4 text-center">📊 Generador de Gráficos</h1>

    <label class="block mb-2 font-medium">Etiquetas (separadas por coma):</label>
    <input type="text" name="etiquetas" required class="w-full mb-4 p-2 border rounded" placeholder="Enero,Febrero,Marzo">

    <label class="block mb-2 font-medium">Valores (separados por coma):</label>
    <input type="text" name="valores" required class="w-full mb-4 p-2 border rounded" placeholder="10,20,15">

    <label class="block mb-2 font-medium">Tipo de gráfico:</label>
    <select name="tipo" class="w-full mb-6 p-2 border rounded">
      <option value="barras">Barras</option>
      <option value="linea">Línea</option>
      <option value="pastel">Pastel</option>
    </select>

    <button class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
      Generar Gráfico
    </button>
  </form>
</body>
</html>
